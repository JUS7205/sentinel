[package]
name = "sentinel"
version = "0.1.0"
edition = "2021"
description = "Sentinel — runtime behavioral guard for AI agents (observer core)"
license = "Apache-2.0"
repository = "https://github.com/JUS7205/sentinel"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cross-platform process-tree + connection enumeration via Win32 on Windows.
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }
